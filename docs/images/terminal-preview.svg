<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- CRT Screen Gradients & Scanlines -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f1910" />
      <stop offset="70%" stop-color="#060c07" />
      <stop offset="100%" stop-color="#020502" />
    </radialGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dc653" />
      <stop offset="100%" stop-color="#52b788" />
    </linearGradient>
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" opacity="0.35" />
    </pattern>
    <filter id="crtBloom">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Chassis & Screen -->
  <rect width="1200" height="675" fill="#0b0f0b" />
  <rect x="15" y="15" width="1170" height="645" rx="8" fill="url(#screenGlow)" stroke="#1a2e1d" stroke-width="2" />

  <!-- Top System Telemetry Bar -->
  <g filter="url(#crtBloom)" font-family="'Courier New', Courier, monospace">
    <rect x="25" y="25" width="1150" height="48" fill="#0e1b10" stroke="#22542a" stroke-width="1.5" rx="4" />
    <text x="45" y="55" fill="#38ef7d" font-size="16" font-weight="bold" letter-spacing="2">☣ LAST BREATH // TACTICAL FIELD TERMINAL v2.4.0</text>
    <text x="650" y="55" fill="#ffb703" font-size="13" letter-spacing="1">TIME: GÜN 04 | 08:42 // FAZ: GÜNDÜZ</text>
    <rect x="940" y="37" width="110" height="24" rx="3" fill="#2d1500" stroke="#fb8500" stroke-width="1" />
    <text x="955" y="53" fill="#fb8500" font-size="11" font-weight="bold">DEFCON: 2</text>
    <circle cx="1080" cy="49" r="6" fill="#38ef7d" />
    <text x="1095" y="54" fill="#38ef7d" font-size="12">PWA ONLINE</text>
  </g>

  <!-- Left Column: Survivor Profile & Bio-Telemetry -->
  <g filter="url(#crtBloom)" font-family="'Courier New', Courier, monospace">
    <rect x="25" y="85" width="310" height="450" fill="#09130a" stroke="#1f4424" stroke-width="1" rx="4" />
    
    <!-- Profile Header -->
    <rect x="25" y="85" width="310" height="32" fill="#142c19" />
    <text x="40" y="106" fill="#a3e635" font-size="13" font-weight="bold">OPERATÖR TELEMETRİSİ</text>
    
    <text x="40" y="140" fill="#88aa88" font-size="12">KOD ADI : <tspan fill="#ffffff" font-weight="bold">KORHAN (HURDACI)</tspan></text>
    <text x="40" y="162" fill="#88aa88" font-size="12">YAŞ / KAN: <tspan fill="#ffffff">29 YAŞ | 0 Rh+ POZİTİF</tspan></text>
    <text x="40" y="184" fill="#88aa88" font-size="12">MİZAÇ   : <tspan fill="#ffffff">METANETLİ, HURDACI GÖZÜ</tspan></text>
    <text x="40" y="206" fill="#88aa88" font-size="12">KONUM   : <tspan fill="#ffb703">İSTANBUL (HARABE ŞEHİR)</tspan></text>

    <line x1="40" y1="220" x2="315" y2="220" stroke="#1f4424" stroke-width="1" stroke-dasharray="4" />

    <!-- Bio Meters -->
    <text x="40" y="246" fill="#e0e0e0" font-size="12">SAĞLIK DURUMU (HP)</text>
    <text x="270" y="246" fill="#38ef7d" font-size="12" font-weight="bold">92%</text>
    <rect x="40" y="254" width="275" height="10" fill="#1b2e1e" rx="2" />
    <rect x="40" y="254" width="253" height="10" fill="url(#greenGrad)" rx="2" />

    <text x="40" y="286" fill="#e0e0e0" font-size="12">HİDRASYON (SU)</text>
    <text x="270" y="286" fill="#38ef7d" font-size="12" font-weight="bold">78%</text>
    <rect x="40" y="294" width="275" height="10" fill="#1b2e1e" rx="2" />
    <rect x="40" y="294" width="214" height="10" fill="#00b4d8" rx="2" />

    <text x="40" y="326" fill="#e0e0e0" font-size="12">KALORİ (TOKLUK)</text>
    <text x="270" y="326" fill="#ffb703" font-size="12" font-weight="bold">64%</text>
    <rect x="40" y="334" width="275" height="10" fill="#1b2e1e" rx="2" />
    <rect x="40" y="334" width="176" height="10" fill="url(#amberGrad)" rx="2" />

    <text x="40" y="366" fill="#e0e0e0" font-size="12">RADYASYON YÜKÜ</text>
    <text x="270" y="366" fill="#38ef7d" font-size="12" font-weight="bold">14 mSv</text>
    <rect x="40" y="374" width="275" height="10" fill="#1b2e1e" rx="2" />
    <rect x="40" y="374" width="38" height="10" fill="#52b788" rx="2" />

    <text x="40" y="406" fill="#e0e0e0" font-size="12">ÇANTA YÜKÜ (AĞIRLIK)</text>
    <text x="260" y="406" fill="#ffb703" font-size="12" font-weight="bold">18.4/30 kg</text>
    <rect x="40" y="414" width="275" height="10" fill="#1b2e1e" rx="2" />
    <rect x="40" y="414" width="168" height="10" fill="#fb8500" rx="2" />

    <!-- Trait / Buff Indicators -->
    <rect x="40" y="445" width="130" height="26" fill="#132617" stroke="#22542a" stroke-width="1" rx="2" />
    <text x="50" y="462" fill="#a3e635" font-size="11">▲ HURDACI BONUSU</text>
    <rect x="180" y="445" width="135" height="26" fill="#132617" stroke="#22542a" stroke-width="1" rx="2" />
    <text x="190" y="462" fill="#38ef7d" font-size="11">● SUZUZLUK DİRENCİ</text>
    
    <rect x="40" y="482" width="275" height="40" fill="#1a1506" stroke="#b08900" stroke-width="1" rx="2" />
    <text x="50" y="506" fill="#ffd166" font-size="11" font-weight="bold">UYARI: YAKIN ÇEVREDE YAĞMACI SİNYALİ</text>
  </g>

  <!-- Center Column: Tactical World Map & Radar -->
  <g filter="url(#crtBloom)" font-family="'Courier New', Courier, monospace">
    <rect x="345" y="85" width="530" height="450" fill="#081009" stroke="#1f4424" stroke-width="1" rx="4" />
    
    <!-- Map Header -->
    <rect x="345" y="85" width="530" height="32" fill="#142c19" />
    <text x="360" y="106" fill="#38ef7d" font-size="13" font-weight="bold">SEKTÖR HARİTASI // RADAR &amp; YOL AĞI</text>
    <text x="730" y="106" fill="#88aa88" font-size="12">ÖLÇEK: 1:50000</text>

    <!-- Map Grid & Lines -->
    <g opacity="0.35">
      <line x1="365" y1="180" x2="855" y2="180" stroke="#2a6635" stroke-dasharray="2" />
      <line x1="365" y1="260" x2="855" y2="260" stroke="#2a6635" stroke-dasharray="2" />
      <line x1="365" y1="340" x2="855" y2="340" stroke="#2a6635" stroke-dasharray="2" />
      <line x1="365" y1="420" x2="855" y2="420" stroke="#2a6635" stroke-dasharray="2" />
      <line x1="480" y1="130" x2="480" y2="510" stroke="#2a6635" stroke-dasharray="2" />
      <line x1="610" y1="130" x2="610" y2="510" stroke="#2a6635" stroke-dasharray="2" />
      <line x1="740" y1="130" x2="740" y2="510" stroke="#2a6635" stroke-dasharray="2" />
    </g>

    <!-- Radar Range Circles -->
    <circle cx="610" cy="300" r="140" fill="none" stroke="#1f4e28" stroke-width="1" opacity="0.4" />
    <circle cx="610" cy="300" r="80" fill="none" stroke="#296634" stroke-width="1" opacity="0.5" />
    <line x1="610" y1="300" x2="720" y2="220" stroke="#38ef7d" stroke-width="1.5" opacity="0.7" />

    <!-- Sector Routes (Interconnections) -->
    <line x1="460" y1="250" x2="570" y2="230" stroke="#38ef7d" stroke-width="2" stroke-dasharray="4" />
    <line x1="570" y1="230" x2="720" y2="310" stroke="#fb8500" stroke-width="2" stroke-dasharray="4" />
    <line x1="570" y1="230" x2="520" y2="380" stroke="#38ef7d" stroke-width="2" stroke-dasharray="4" />
    <line x1="520" y1="380" x2="720" y2="310" stroke="#38ef7d" stroke-width="2" stroke-dasharray="4" />

    <!-- Sector Node: Edirne -->
    <circle cx="460" cy="250" r="7" fill="#142c19" stroke="#38ef7d" stroke-width="2" />
    <text x="420" y="275" fill="#88aa88" font-size="11">EDİRNE (▲1)</text>

    <!-- Sector Node: Istanbul (Active Player Location) -->
    <circle cx="570" cy="230" r="14" fill="#000" stroke="#ffb703" stroke-width="2" stroke-dasharray="3" />
    <circle cx="570" cy="230" r="7" fill="#ffb703" />
    <text x="525" y="210" fill="#ffb703" font-size="13" font-weight="bold">İSTANBUL (▲3)</text>
    <rect x="520" y="180" width="105" height="18" fill="#2d1500" stroke="#fb8500" stroke-width="1" rx="2" />
    <text x="528" y="193" fill="#fb8500" font-size="10" font-weight="bold">MEVCUT KONUM</text>

    <!-- Sector Node: Bursa -->
    <circle cx="520" cy="380" r="7" fill="#142c19" stroke="#38ef7d" stroke-width="2" />
    <text x="480" y="405" fill="#88aa88" font-size="11">BURSA (▲2)</text>

    <!-- Sector Node: Ankara -->
    <circle cx="720" cy="310" r="9" fill="#142c19" stroke="#ef233c" stroke-width="2" />
    <text x="735" y="315" fill="#ef233c" font-size="12" font-weight="bold">ANKARA (▲4)</text>

    <!-- Action Prompt Overlay -->
    <rect x="365" y="455" width="490" height="65" fill="#0c1b0f" stroke="#22542a" stroke-width="1" rx="3" />
    <text x="380" y="480" fill="#38ef7d" font-size="12" font-weight="bold">SEÇİLİ SEKTÖR EYLEMLERİ:</text>
    <rect x="380" y="490" width="110" height="22" fill="#1a3d21" stroke="#38ef7d" stroke-width="1" rx="2" />
    <text x="395" y="505" fill="#fff" font-size="11">[ARA / YAĞMALA]</text>
    <rect x="500" y="490" width="110" height="22" fill="#1a3d21" stroke="#38ef7d" stroke-width="1" rx="2" />
    <text x="520" y="505" fill="#fff" font-size="11">[DİNLEN / UYU]</text>
    <rect x="620" y="490" width="110" height="22" fill="#1a3d21" stroke="#38ef7d" stroke-width="1" rx="2" />
    <text x="635" y="505" fill="#fff" font-size="11">[ÜS / CRAFTING]</text>
    <rect x="740" y="490" width="100" height="22" fill="#3a2500" stroke="#ffb703" stroke-width="1" rx="2" />
    <text x="755" y="505" fill="#ffb703" font-size="11">[SEYAHAT ET]</text>
  </g>

  <!-- Right Column: Equipment & Active Loadout -->
  <g filter="url(#crtBloom)" font-family="'Courier New', Courier, monospace">
    <rect x="885" y="85" width="290" height="450" fill="#09130a" stroke="#1f4424" stroke-width="1" rx="4" />
    
    <!-- Equipment Header -->
    <rect x="885" y="85" width="290" height="32" fill="#142c19" />
    <text x="900" y="106" fill="#a3e635" font-size="13" font-weight="bold">KUŞANILAN TEÇHİZAT</text>

    <!-- Slots -->
    <g transform="translate(900, 130)">
      <!-- Primary Weapon -->
      <rect x="0" y="0" width="260" height="52" fill="#112214" stroke="#22542a" stroke-width="1" rx="3" />
      <text x="10" y="20" fill="#88aa88" font-size="10">BİRİNCİL SİLAH [MAIN_HAND]</text>
      <text x="10" y="38" fill="#ffffff" font-size="12" font-weight="bold">GLOCK 19 (9x19mm NATO)</text>
      <text x="210" y="38" fill="#38ef7d" font-size="12">15/15</text>

      <!-- Off-hand / Melee -->
      <rect x="0" y="60" width="260" height="52" fill="#112214" stroke="#22542a" stroke-width="1" rx="3" />
      <text x="10" y="80" fill="#88aa88" font-size="10">İKİNCİL / YAKIN DÖVÜŞ</text>
      <text x="10" y="98" fill="#ffffff" font-size="12" font-weight="bold">DİKENLİ BEYZBOL SOPASI</text>
      <text x="215" y="98" fill="#ffb703" font-size="12">84%</text>

      <!-- Armor -->
      <rect x="0" y="120" width="260" height="52" fill="#112214" stroke="#22542a" stroke-width="1" rx="3" />
      <text x="10" y="140" fill="#88aa88" font-size="10">GÖĞÜS ZIRHI [BODY_ARMOR]</text>
      <text x="10" y="158" fill="#ffffff" font-size="12" font-weight="bold">SEVİYE IV SERAMİK YELEK</text>
      <text x="210" y="158" fill="#38ef7d" font-size="12">+45 DEF</text>

      <!-- Backpack -->
      <rect x="0" y="180" width="260" height="52" fill="#112214" stroke="#22542a" stroke-width="1" rx="3" />
      <text x="10" y="200" fill="#88aa88" font-size="10">ÇANTA [BACKPACK]</text>
      <text x="10" y="218" fill="#ffffff" font-size="12" font-weight="bold">75L EKSPEDİSYON ÇANTASI</text>
      <text x="210" y="218" fill="#38ef7d" font-size="12">+30 KG</text>

      <!-- Medical Quick Slot -->
      <rect x="0" y="240" width="260" height="52" fill="#112214" stroke="#22542a" stroke-width="1" rx="3" />
      <text x="10" y="260" fill="#88aa88" font-size="10">HIZLI SAĞLIK YUVASI</text>
      <text x="10" y="278" fill="#52b788" font-size="12" font-weight="bold">CAT TURRİKE + HEMOSTATİK</text>
      <text x="225" y="278" fill="#38ef7d" font-size="12">x2</text>
    </g>

    <rect x="900" y="445" width="260" height="75" fill="#0d180f" stroke="#1f4424" stroke-width="1" rx="3" />
    <text x="912" y="468" fill="#ffb703" font-size="11" font-weight="bold">EN ÖNEMLİ ENVANTER:</text>
    <text x="912" y="488" fill="#e0e0e0" font-size="11">● 1x Askeri MRE (Tayın)</text>
    <text x="912" y="506" fill="#e0e0e0" font-size="11">● 2x 500ml Arıtılmış Su | 50x 9mm Mermi</text>
  </g>

  <!-- Bottom Log Terminal Console -->
  <g filter="url(#crtBloom)" font-family="'Courier New', Courier, monospace">
    <rect x="25" y="545" width="1150" height="105" fill="#070c08" stroke="#1f4424" stroke-width="1.5" rx="4" />
    <rect x="25" y="545" width="1150" height="24" fill="#102013" />
    <text x="40" y="561" fill="#38ef7d" font-size="11" font-weight="bold">SAHA OLAY GÜNLÜĞÜ (TACTICAL EVENT LOG)</text>
    <text x="1020" y="561" fill="#88aa88" font-size="11">[OTO-KAYIT AKTİF]</text>

    <text x="40" y="586" fill="#88aa88" font-size="12">[06:45] Gün doğumu. Havadaki radyasyon seviyesi stabil seyrediyor (14 mSv).</text>
    <text x="40" y="606" fill="#a3e635" font-size="12">[07:30] Sektörde yağmalama yapıldı: Bulunanlar: 1x CAT Turnike, 1x Konserve Et, 5x Hurda Bakır.</text>
    <text x="40" y="626" fill="#ffb703" font-size="12">[08:15] YAKLAŞAN TEHLİKE: Harabe binaların arasından 2 adet yağmacı çete üyesinin adımları duyuldu!</text>
    <text x="40" y="642" fill="#38ef7d" font-size="12">[08:42] Komut bekleniyor: [A] Çatışma Pozisyonu Al | [B] Gizlice Geri Çekil | [C] Barikat Kur</text>
  </g>

  <!-- CRT Scanlines and Screen Glass Effect Overlay -->
  <rect x="15" y="15" width="1170" height="645" fill="url(#scanlines)" pointer-events="none" />
</svg>
